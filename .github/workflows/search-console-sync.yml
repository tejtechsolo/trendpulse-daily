name: TrendPulse Search Console Sync

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

jobs:
  sync-search-console:
    runs-on: ubuntu-latest
    steps:
      - name: Validate production configuration
        env:
          APP_URL: ${{ secrets.TRENDPULSE_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$APP_URL" || (echo "Missing TRENDPULSE_APP_URL" && exit 1)
          test -n "$CRON_SECRET" || (echo "Missing CRON_SECRET" && exit 1)
          case "$APP_URL" in
            https://*) ;;
            *) echo "TRENDPULSE_APP_URL must be an HTTPS URL"; exit 1 ;;
          esac

      - name: Sync Google Search Console
        env:
          APP_URL: ${{ secrets.TRENDPULSE_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          APP_URL="${APP_URL%/}"
          curl --fail --show-error --silent --retry 2 --connect-timeout 15 --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/search-console"
