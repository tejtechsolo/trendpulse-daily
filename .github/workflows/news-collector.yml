name: TrendPulse News Intelligence

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  collect-and-process:
    runs-on: ubuntu-latest
    steps:
      - name: Validate production configuration
        env:
          APP_URL: ${{ secrets.TRENDPULSE_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "ERROR: Missing GitHub Actions secret TRENDPULSE_APP_URL."
            echo "Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "ERROR: Missing GitHub Actions secret CRON_SECRET."
            echo "Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          APP_URL="${APP_URL%/}"
          case "$APP_URL" in
            https://*) ;;
            *) echo "ERROR: TRENDPULSE_APP_URL must be an HTTPS URL."; exit 1 ;;
          esac
          echo "Production URL configured: ${APP_URL}"

      - name: Production health check
        env:
          APP_URL: ${{ secrets.TRENDPULSE_APP_URL }}
        run: |
          APP_URL="${APP_URL%/}"
          curl --fail --show-error --silent --retry 2 --connect-timeout 15 "$APP_URL/api/health"

      - name: Collect news
        env:
          APP_URL: ${{ secrets.TRENDPULSE_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          APP_URL="${APP_URL%/}"
          curl --fail --show-error --silent --retry 2 --connect-timeout 15 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/collect-news"

      - name: Collect Google Trends signals
        env:
          APP_URL: ${{ secrets.TRENDPULSE_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          APP_URL="${APP_URL%/}"
          curl --fail --show-error --silent --retry 2 --connect-timeout 15 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/google-trends"

      - name: Process news queue
        env:
          APP_URL: ${{ secrets.TRENDPULSE_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          APP_URL="${APP_URL%/}"
          curl --fail --show-error --silent --retry 2 --connect-timeout 15 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/process-news"

      - name: Publish due scheduled articles
        env:
          APP_URL: ${{ secrets.TRENDPULSE_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          APP_URL="${APP_URL%/}"
          curl --fail --show-error --silent --retry 2 --connect-timeout 15 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/publish-scheduled"

      - name: Run SEO audit
        env:
          APP_URL: ${{ secrets.TRENDPULSE_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          APP_URL="${APP_URL%/}"
          curl --fail --show-error --silent --retry 2 --connect-timeout 15 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/seo-audit"

      - name: Generate content opportunities
        env:
          APP_URL: ${{ secrets.TRENDPULSE_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          APP_URL="${APP_URL%/}"
          curl --fail --show-error --silent --retry 2 --connect-timeout 15 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/content-opportunities"
