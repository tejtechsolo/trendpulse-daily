name: TrendPulse News Intelligence

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  collect-and-process:
    runs-on: ubuntu-latest
    steps:
      - name: Collect news
        env:
          APP_URL: ${{ secrets.TRENDPULSE_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$APP_URL"
          test -n "$CRON_SECRET"
          curl --fail --show-error --silent \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/collect-news"

      - name: Process news queue
        env:
          APP_URL: ${{ secrets.TRENDPULSE_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --show-error --silent \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/process-news"

      - name: Publish due scheduled articles
        env:
          APP_URL: ${{ secrets.TRENDPULSE_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --show-error --silent \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/publish-scheduled"
